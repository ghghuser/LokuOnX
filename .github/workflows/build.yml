name: build

on:
  push:
    branches: [main]
    # 文書だけの変更（PROJECT.md・docs・txt）ではビルドしない（成果物の入れ替わりと時間の節約）。タグ(v*)の push には適用されない
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  # BtbN の LGPL ビルド（n8.1）。404 のときは master 版へ自動で切り替える
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
  FFMPEG_URL_FALLBACK: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single file)
        shell: pwsh
        run: dotnet publish src/LokuOnX.csproj -c Release -o publish

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ffmpeg_dl | Out-Null
          # 一時的な 502/503 に備えて、各URLを最大5回（待ち時間を伸ばしながら）試す。だめなら次のURLへ
          $ok = $false
          foreach ($u in @($env:FFMPEG_URL, $env:FFMPEG_URL_FALLBACK)) {
            for ($i = 1; $i -le 5 -and -not $ok; $i++) {
              try {
                Invoke-WebRequest -Uri $u -OutFile ffmpeg_dl/ffmpeg.zip
                $ok = $true
              } catch {
                Write-Host "Download failed ($u, try $i/5): $($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $i)
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw 'FFmpeg download failed' }
          Expand-Archive -Path ffmpeg_dl/ffmpeg.zip -DestinationPath ffmpeg_dl/x
          $exe = Get-ChildItem -Path ffmpeg_dl/x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in archive' }
          Write-Host "Found: $($exe.FullName)"
          "FFMPEG_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFMPEG_ROOT=$($exe.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check FFmpeg encoders (libmp3lame / aac / flac / libvorbis / libopus / pcm_s16le)
        shell: pwsh
        run: |
          $out = & $env:FFMPEG_EXE -hide_banner -encoders 2>&1 | Out-String
          foreach ($name in 'libmp3lame', 'aac', 'flac', 'libvorbis', 'libopus', 'pcm_s16le') {
            if ($out -notmatch "(?m)^\s*A\S*\s+$name\s") {
              Write-Host $out
              throw "error: FFmpeg encoder '$name' is missing"
            }
          }
          & $env:FFMPEG_EXE -version | Select-Object -First 1

      - name: Stage distribution folder
        shell: pwsh
        run: |
          $dst = 'dist/LokuOnX'
          New-Item -ItemType Directory -Force -Path "$dst/ffmpeg" | Out-Null
          Copy-Item publish/LokuOnX.exe "$dst/LokuOnX.exe"
          Copy-Item $env:FFMPEG_EXE "$dst/ffmpeg/ffmpeg.exe"
          $lic = Get-ChildItem -Path $env:FFMPEG_ROOT -Filter 'LICENSE*' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$dst/ffmpeg/LICENSE.txt" }
          Write-Host '--- dist contents ---'
          Get-ChildItem -Recurse dist | ForEach-Object { $_.FullName.Replace((Get-Location).Path, '') }

      # artifact は ZIP にしない（GitHub が自動で ZIP 化するため、入れると二重になる）
      - name: Upload artifact (folder)
        uses: actions/upload-artifact@v4
        with:
          name: LokuOnX-win-x64
          path: dist/
          if-no-files-found: error

      # 成果物は直近2つだけ残す（古いものを削除。失敗してもビルドは失敗にしない）
      - name: Keep only latest 2 artifacts
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh api "repos/${{ github.repository }}/actions/artifacts?name=LokuOnX-win-x64&per_page=100" | ConvertFrom-Json
          $old = $json.artifacts | Where-Object { -not $_.expired } | Sort-Object created_at -Descending | Select-Object -Skip 2
          foreach ($a in $old) {
            Write-Host "delete artifact $($a.id) ($($a.created_at))"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$($a.id)"
          }

      - name: Make release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/LokuOnX -DestinationPath LokuOnX-win-x64.zip -Force

      - name: Attach ZIP to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag LokuOnX-win-x64.zip --clobber
          } else {
            gh release create $tag LokuOnX-win-x64.zip --title $tag --generate-notes
          }
