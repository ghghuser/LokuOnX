name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-8.1.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: dotnet publish Recorder.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "error: ffmpeg.exe not found in archive"; exit 1 }
          New-Item -ItemType Directory -Force -Path publish/ffmpeg | Out-Null
          Copy-Item $exe.FullName publish/ffmpeg/ffmpeg.exe
          $lic = Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName publish/ffmpeg/LICENSE.txt }

      - name: Check FFmpeg encoders
        shell: pwsh
        run: |
          $out = & publish/ffmpeg/ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String
          foreach ($enc in @("libmp3lame", "aac", "flac")) {
            if ($out -notmatch "\b$enc\b") { Write-Error "error: encoder $enc is missing in this FFmpeg build"; exit 1 }
            Write-Host "OK: $enc"
          }

      - name: Make ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage/LokuonX | Out-Null
          Copy-Item -Path publish/* -Destination stage/LokuonX -Recurse
          Compress-Archive -Path stage/LokuonX -DestinationPath LokuonX-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LokuonX-win-x64
          path: LokuonX-win-x64.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LokuonX-win-x64.zip
