name: SonarQube
on:
  push:
    branches:
      - main
    # 文書だけの変更では解析しない（build.yml と同じ）
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.txt'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:   # 手動実行。実行したときだけ、解析のあとに SonarCloud の issue 一覧をログへ出す（下の最後の手順）
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # S1244（浮動小数点を == / != で比べる）は、コピーした設定値が同じかの判定や「既定値のときの近道」で、意図した比較なので対象外にする
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"ghghuser_LokuOnX" /o:"ghghuser" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.issue.ignore.multicriteria=e1 /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S1244" /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/*.cs"
          # ソリューションファイルが無いので、アプリ本体を指定してビルドする（ルートで dotnet build だけだと対象が決まらず失敗する）
          dotnet build src/LokuOnX.csproj -c Release
          dotnet build gokko/Gokko4DJ.csproj -c Release
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # 手動実行（workflow_dispatch）のときだけ: SonarCloud の API から未解決の issue を全件取り、重大度順にログと実行の要約へ出す。
      # 解析結果が SonarCloud に反映される（Compute Engine のタスク完了）まで待ってから取得する。失敗しても全体は失敗にしない
      - name: Export SonarCloud issues (manual run only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          $h = @{ Authorization = "Bearer $env:SONAR_TOKEN" }
          $rt = Get-ChildItem -Recurse -Force -Filter report-task.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($rt) {
            $url = ((Get-Content $rt.FullName | Where-Object { $_ -like 'ceTaskUrl=*' }) -replace '^ceTaskUrl=', '')
            for ($i = 0; $i -lt 36; $i++) {
              $t = Invoke-RestMethod -Uri $url -Headers $h
              Write-Host "analysis task: $($t.task.status)"
              if ($t.task.status -in 'SUCCESS', 'FAILED', 'CANCELED') { break }
              Start-Sleep -Seconds 10
            }
          } else { Write-Host 'report-task.txt not found; waiting 60s'; Start-Sleep -Seconds 60 }

          $all = @(); $p = 1
          do {
            $r = Invoke-RestMethod -Headers $h -Uri "https://sonarcloud.io/api/issues/search?organization=ghghuser&componentKeys=ghghuser_LokuOnX&resolved=false&ps=500&p=$p"
            $all += $r.issues
            $p++
          } while ($all.Count -lt $r.total -and $r.issues.Count -gt 0)

          $order = @{ BLOCKER = 0; CRITICAL = 1; MAJOR = 2; MINOR = 3; INFO = 4 }
          $sorted = $all | Sort-Object { $order[$_.severity] }, rule, component, line
          $lines = @("total issues: $($all.Count)")
          $lines += '--- by severity ---'
          $lines += ($all | Group-Object severity | Sort-Object { $order[$_.Name] } | ForEach-Object { "$($_.Name): $($_.Count)" })
          $lines += '--- by rule (severity, count) ---'
          $lines += ($all | Group-Object rule | Sort-Object { $order[($_.Group[0]).severity] }, @{ Expression = 'Count'; Descending = $true } | ForEach-Object { "$($_.Name) [$(($_.Group[0]).severity)] x$($_.Count)  e.g. $(($_.Group[0]).message)" })
          $lines += '--- all issues ---'
          $lines += ($sorted | ForEach-Object { "[$($_.severity)] $($_.rule) $($_.component -replace '^ghghuser_LokuOnX:', ''):$($_.line) $($_.message)" })
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -FilePath sonar-issues.txt -Encoding utf8
          $lines | Select-Object -First 60 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload SonarCloud issue list (manual run only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sonar-issues
          path: sonar-issues.txt
          if-no-files-found: ignore
