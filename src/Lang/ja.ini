; LokuOnX 画面の文言（UTF-8）。「キー=文」。; か # で始まる行はコメント。改行は \n、\ は \\ と書く。
; {0} {1} は実行時に値が入る場所なので消さないこと。キーが無いときは exe 内の既定が使われる。変更後は再起動。

settings.title=設定とヘルプ
settings.tab.advanced=詳細設定
settings.section.display=表示
settings.theme=画面の色
settings.theme.tip=自動＝Windowsの設定に合わせます（起動時に判定）。ダークでは、Windows 11 なら半透明（アクリル）になります
settings.section.recording=録音
settings.sleep=録音中はスリープさせない
settings.lost.heading=録音中にデバイスが外れたとき
settings.lost.wait=すべてのデバイスが未接続になったら、再接続されるまで一時停止する
settings.lost.wait.tip=OFF：無音で埋めて録音を続けます。ON：使えるデバイスが1台も無くなったら一時停止し（無音は入れません）、再接続されたら自動で再開します。1台でも録れていれば続けます。
settings.lost.split=デバイスが再接続されたら、録音ファイルを分割する
settings.lost.split.tip=外れていたデバイスが再接続された時点で、次のファイルへ分割します。上の「一時停止」とは関係なく、単独で使えます。
settings.section.asio=ASIO（上級者向け）
settings.asio=入力デバイスの一覧にASIOを表示する
settings.asio.tip=FlexASIO などのASIOドライバが入っているときだけ、一覧の最後に「🎛 ドライバ名 入力1-2」のように出ます。通常のマイクやスピーカーの録音には不要です
settings.asio.note=ASIOはドライバを専有するため、同時に使えるのは1行だけです（マイクやスピーカーとの同時録音は可能です）。録音中の切り替えは、録音が終わってから一覧に反映されます。
settings.section.tray=タスクトレイ
settings.tray=タスクトレイにアイコンを表示する
settings.tray.tip=ダブルクリックで画面を開き、右クリックで 録音開始／停止・一時停止・分割・終了 を操作できます。録音中は、アイコンが赤い丸に変わります
settings.tray.min=最小化したらトレイへ格納する（タスクバーには残さない）
settings.tray.min.tip=OFFのときは、最小化してもタスクバーに残ります。トレイのアイコンを表示しているときだけ使えます。格納したままでも録音は続きます
settings.tab.help=ヘルプ
settings.tab.about=バージョン情報
settings.close=閉じる
help.1=■ ファイル名やフォルダ名の変数は、「ファイル名」欄の右の「？」ボタンで説明と入力補助が開きます。
help.2=■ プロファイルは exe と同じ場所の Profiles フォルダに「名前.json」で保存されます（保存先と番号は含みません）。
help.3=■ エラーは音の鳴るポップアップではなく、原因の近くに赤文字で表示されます。
help.4=■ 長さを正しく表示したいときは、aac は m4a を選んでください。
help.5=■ ファイル一覧の ＊ は、起動後に作られたファイル（白に近い文字）です。再生中は、別のファイルを選んでも止まりません。
help.6=■ 予約録音が有効なときは、画面の上の段に「⏰ 予約 …」が黄色く出ます。録音中はトレイのアイコンが赤い丸、音を待っている待機中は黄色いリングに変わります。
help.7=■ メーターの白い線は直近の最大値、右端の四角が赤くなるとクリップです。ゲインを左端にするとミュート（橙色の表示）になります。
about.github=GitHub のリポジトリ
about.folder=設定ファイル・ログのフォルダを開く
hotkey.title=ホットキー
hotkey.use=ホットキーを使う（どのアプリを使っていても効きます）
hotkey.start=録音の開始・停止
hotkey.pause=一時停止・再開
hotkey.split=分割
hotkey.box.tip=欄をクリックして、割り当てたいキーを押します（Ctrl・Alt・Shift・Win のどれかと一緒に）。Delete か BackSpace で未設定にします
hotkey.clear=解除
hotkey.restore.tip=既定のキーに戻す（開始・停止 Ctrl+Alt+F9／一時停止 Ctrl+Alt+F10／分割 Ctrl+Alt+F11）
hotkey.err.restoreTaken=既定のキー {0} は、ほかの操作に割り当て済みのため戻せません。先にそちらを変えるか解除してください。
hotkey.err.needModifier=Ctrl・Alt・Shift・Win のどれかを押しながら、F1〜F24・英字・数字などのキーを押してください。
hotkey.err.badKey=そのキーは使えません。
hotkey.err.duplicate=同じキーを2つの操作に割り当てることはできません: {0}
theme.auto=自動（Windowsに合わせる）
theme.light=ライト
theme.dark=ダーク
theme.soft=ライト (ニューモーフィズム風)
theme.softdark=ダーク (ニューモーフィズム風)
