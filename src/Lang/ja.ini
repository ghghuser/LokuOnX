settings.tab.help=ヘルプ
settings.tab.about=バージョン情報
settings.close=閉じる
help.1=■ ファイル名やフォルダ名の変数は、「ファイル名」欄の右の「？」ボタンで説明と入力補助が開きます。
help.2=■ プロファイルは exe と同じ場所の Profiles フォルダに「名前.json」で保存されます（保存先と番号は含みません）。
help.3=■ エラーは音の鳴るポップアップではなく、原因の近くに赤文字で表示されます。
help.4=■ 長さを正しく表示したいときは、aac は m4a を選んでください。
help.5=■ ファイル一覧の ＊ は、起動後に作られたファイル（白に近い文字）です。再生中は、別のファイルを選んでも止まりません。
help.6=■ 予約録音が有効なときは、画面の上の段に「⏰ 予約 …」が黄色く出ます。録音中はトレイのアイコンが赤い丸、音を待っている待機中は黄色いリングに変わります。
help.7=■ メーターの白い線は直近の最大値、右端の四角が赤くなるとクリップです。ゲインを左端にするとミュート（橙色の表示）になります。
