; LokuOnX 画面の文言（UTF-8）。「キー=文」。; か # で始まる行はコメント。改行は \n、\ は \\ と書く。
; {0} {1} は実行時に値が入る場所なので消さないこと。キーが無いときは exe 内の既定が使われる。変更後は再起動。

